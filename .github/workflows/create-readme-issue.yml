name: Create README Issue

on:
  push:
    branches:
      - copilot/add-readme-for-octoacme-project-docs

permissions:
  issues: write
  contents: read

jobs:
  create_issue:
    name: Create README Issue for OctoAcme Project Management Docs
    runs-on: ubuntu-latest
    steps:
      - name: Check if issue already exists
        id: check_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_COUNT=$(gh issue list \
            --repo "${{ github.repository }}" \
            --search "[Process Doc Update]: README" \
            --state open \
            --json number \
            --jq 'length')
          echo "issue_count=$ISSUE_COUNT" >> $GITHUB_OUTPUT

      - name: Create issue
        if: steps.check_issue.outputs.issue_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "[Process Doc Update]: README, Project Management Processes Summary, and Links for OctoAcme Project Management Docs" \
            --label "documentation" \
            --label "process improvement" \
            --body "### Which process document do you want to update? (If this is a new document, select '<new document>')

          <new document>

          ### Summary of New Content

          Create a new README for OctoAcme Project Management Docs that includes:
          - Links to all documents in the \`docs/\` folder
          - A brief summary of the project management processes used by OctoAcme
          - An overview of the project management lifecycle and key phases

          ### Why is this update needed?

          To provide a centralized entry point for OctoAcme's project management documentation, making it easier for team members to navigate, discover, and reference all available process documents. A README will improve onboarding, reduce single-person dependency risk, and ensure consistent access to project management knowledge.

          ### Suggested Content (optional)

          The README should include:
          - A title and brief description of OctoAcme's project management approach
          - A summary of the key project management processes (initiation, planning, execution & tracking, risks & communication, release & deployment, retrospective & continuous improvement)
          - A table or list of links to all docs in the \`docs/\` folder with short descriptions
          - Information about roles and personas

          ### Acceptance Criteria

          - [x] Content aligns with existing process docs
          - [x] Update improves clarity or closes a documented gap
          - [ ] Proposed content has been reviewed with stakeholders (if needed)"
